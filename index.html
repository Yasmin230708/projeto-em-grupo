<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contagem Regressiva Premium - 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"&gt;
<link rel="preconnect" href="https://fonts.gstatic.com&quot; crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap&quot; rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="current-date-box">
<p>Hoje é: <span id="current-date">--/--/----</span> | <span id="current-time">00:00:00</span></p>
</div>

<div class="countdown-container">
<header>
<h1>Rumo ao Ano Novo de 2027</h1>
<p class="subtitle">O tempo não para. Aproveite cada segundo!</p>
</header>

<div class="countdown-timer">
<div class="time-card">
<span id="days">00</span>
<p>Dias</p>
</div>
<div class="time-card">
<span id="hours">00</span>
<p>Horas</p>
</div>
<div class="time-card">
<span id="minutes">00</span>
<p>Minutos</p>
</div>
<div class="time-card">
<span id="seconds">00</span>
<p>Segundos</p>
</div>
</div>

<div class="progress-section">
<div class="progress-info">
<span>Progresso do ano atual:</span>
<span id="progress-percentage">0%</span>
</div>
<div class="progress-bar-bg">
<div class="progress-bar-fill" id="progress-bar"></div>
</div>
</div>

<p class="message" id="celebration-message">Faça cada dia valer a pena ✨</p>
</div>

<script src="main.js"></script>
</body>
</html>
